[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Security headers (baseline; CSP will be refined as pages/assets are added)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://www.youtube.com https://www.facebook.com https://api.allorigins.win; frame-src https://www.youtube-nocookie.com https://www.google.com; form-action 'self'; upgrade-insecure-requests"

# Admin (Sveltia CMS) needs external script, GitHub/auth connections, and inline/eval behavior
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' blob: data:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com blob:; worker-src 'self' blob:; connect-src 'self' blob: data: https://api.github.com https://github.com https://raw.githubusercontent.com https://objects.githubusercontent.com https://www.githubstatus.com https://sveltia-cms-auth-2.storage-shared24-d9b.workers.dev https://unpkg.com; frame-src 'self' blob: https://github.com https://sveltia-cms-auth-2.storage-shared24-d9b.workers.dev; form-action 'self'"

# Caching: hashed/static assets can be long-lived (adjust if filenames not fingerprinted)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
